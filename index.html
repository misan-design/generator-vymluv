<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generátor výmluv</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥔</text></svg>">
  <style>
    :root {
      --bg: #fff8ec;
      --card: #ffffff;
      --text: #2b2118;
      --muted: #7a6a5a;
      --accent: #e8743b;
      --accent-dark: #c95a24;
      --shadow: 0 10px 30px rgba(80, 50, 20, 0.12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1d1814;
        --card: #2a231d;
        --text: #f4ece3;
        --muted: #b5a493;
        --accent: #f08a4b;
        --accent-dark: #d46f30;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: 100%;
      max-width: 560px;
      text-align: center;
    }
    .potato {
      font-size: 72px;
      display: inline-block;
      transition: transform 0.4s ease;
    }
    .potato.spin { transform: rotate(360deg) scale(1.15); }
    h1 { margin: 8px 0 4px; font-size: clamp(28px, 6vw, 40px); }
    .sub { color: var(--muted); margin: 0 0 24px; }
    .card {
      background: var(--card);
      border-radius: 18px;
      padding: 28px 22px;
      box-shadow: var(--shadow);
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(18px, 4vw, 22px);
      line-height: 1.5;
      transition: opacity 0.2s ease;
    }
    .card.fade { opacity: 0; }
    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 22px;
    }
    button {
      font: inherit;
      font-weight: 600;
      border: none;
      border-radius: 999px;
      padding: 14px 26px;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
    }
    button:active { transform: scale(0.96); }
    .primary { background: var(--accent); color: #fff; }
    .primary:hover { background: var(--accent-dark); }
    .secondary { background: transparent; color: var(--text); border: 2px solid var(--muted); }
    .counter { margin-top: 18px; color: var(--muted); font-size: 14px; }
    footer { margin-top: 32px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="potato" id="potato">🥔</div>
    <h1>Generátor výmluv</h1>
    <p class="sub">Když potřebuješ výmluvu a fantazie stávkuje.</p>

    <div class="card" id="excuse">Klikni na tlačítko a získej dokonalou výmluvu.</div>

    <div class="buttons">
      <button class="primary" id="generate">🎲 Vymysli výmluvu</button>
      <button class="secondary" id="copy">📋 Zkopírovat</button>
    </div>

    <div class="counter" id="counter"></div>

    <footer>Použití na vlastní nebezpečí. Autor nenese odpovědnost za ztracené přátele ani zaměstnání.</footer>
  </main>

  <script>
    // Výmluva se skládá ze tří náhodných dílů: začátek + kdo/co + co se stalo
    const zacatky = [
      "Promiň, nemohl/a jsem přijít, protože",
      "Úkol nemám, protože",
      "Omlouvám se za zpoždění, ale",
      "Nevzal/a jsem telefon, protože",
      "Na schůzku jsem nedorazil/a, jelikož",
      "Nádobí jsem neumyl/a, protože",
      "Do posilovny jsem nešel/nešla, protože",
    ];

    const kdo = [
      "moje kočka",
      "soused z třetího patra",
      "rozzlobený holub",
      "moje babička",
      "skupina turistů z Japonska",
      "můj toustovač",
      "tajemný muž v pyžamu",
      "křeček mého bratrance",
      "robotický vysavač",
      "jedna velmi sebevědomá kachna",
    ];

    const coSeStalo = [
      "zamkl/a moje klíče v mikrovlnce.",
      "vyhlásil/a na mě osobní válku.",
      "mi snědl/a ponožky a musel/a jsem počkat, až je vrátí.",
      "mě uvěznil/a ve hře na schovávanou, která trvala 6 hodin.",
      "prohlásil/a můj byt za nezávislý stát.",
      "mi přeprogramoval/a budík na čínský čas.",
      "mě unesl/a na tajnou poradu o budoucnosti brambor.",
      "se zasekl/a ve dveřích a odmítl/a se pohnout.",
      "mi ukradl/a boty a utekl/a s nimi do parku.",
      "mě přesvědčil/a, že je dnes neděle.",
      "omylem objednal/a 40 pizz na moji adresu.",
      "spustil/a požární alarm, protože chtěl/a slyšet hudbu.",
    ];

    // Hotové výmluvy s odůvodněním (z vymluvy-research.md)
    const hotove = [
      // 🚗 Doprava
      ["Tramvaj odmítla jet, dokud si všichni cestující neřeknou, co mají dneska v plánu.", "Já byl/a poslední a nechtěl/a jsem lhát."],
      ["Navigace mě poslala do Rakouska.", "Prý tam byla kratší fronta."],
      ["Přes silnici přecházela husí rodina o 47 členech.", "Poslední house si zapomněla klíče a vracela se."],
      ["Moje kolo mělo krizi středního věku a odjelo samo k moři.", "Nechalo mi lístek, že se vrátí, až se najde."],
      ["Řidič autobusu se rozhodl, že dnes pojede pozpátku.", "Prý aby viděl, odkud jsme přijeli."],
      ["Zasekl/a jsem se v otočných dveřích obchodního centra.", "Udělal/a jsem 312 koleček, než mě vysvobodila ochranka."],
      // 😴 Zaspání
      ["Budík mi v noci tajně přešel na letní čas jiné planety.", "Na Marsu jsem byl/a ještě včas."],
      ["Zdálo se mi, že už jsem v práci, tak jsem nevstával/a.", "Ve snu jsem byl/a mimochodem velmi produktivní."],
      ["Kočka mi seděla na hrudi a usoudil/a jsem, že by bylo nezdvořilé ji budit.", "Je to starší dáma, má nárok."],
      ["Peřina mě nepustila.", "Doslova. Zip se zasekl a já byl/a uvnitř."],
      ["Telefon se v noci aktualizoval a smazal všechna rána.", "Máme teď jen odpoledne."],
      // 🌧️ Počasí
      ["Foukal tak silný vítr, že jsem dvakrát dorazil/a domů, i když jsem šel/šla opačně.", "Fyzika mi to doteď nevysvětlila."],
      ["Napadlo tolik sněhu, že mě sousedi omylem postavili jako sněhuláka.", "Měl/a jsem mrkev a všechno."],
      ["Pršelo tak, že jsem čekal/a na archu.", "Zvířata šla po dvou a já byl/a sám/sama, tak mě nevzali."],
      ["Bylo takové horko, že se mi rozpustily tkaničky.", "Bosky se jít nedalo, asfalt byl tekutý."],
      ["Mlha byla tak hustá, že jsem zabloudil/a ve vlastní chodbě.", "Našel/našla jsem tam mimochodem ztracené ponožky z roku 2019."],
      // 🤒 Nemoc
      ["Mám alergii na pondělí.", "Doktor říkal, že je to vzácné, ale nevyléčitelné."],
      ["Snědl/a jsem prošlý jogurt a teď mluvím jen ve verších.", "Na poradě by to bylo trapné, rým za rýmem jde mi hladce, však myšlenky mám chabé, vratké."],
      ["Kýchl/a jsem tak silně, že jsem si vyhodil/a záda i fantazii.", "Ani tuhle výmluvu jsem nevymyslel/a sám/sama."],
      ["Zjistil/a jsem, že jsem v noci náměsíčně uběhl/a maraton.", "Mám medaili a nevím odkud."],
      ["Dostal/a jsem škytavku, která trvá už tři dny.", "Lékaři ji pojmenovali po mně."],
      // 👵 Rodina a děti
      ["Babička se naučila používat videohovory a volá každých 5 minut.", "Většinou jen ukazuje strop."],
      ["Synovec mi schoval boty a za nápovědu chce 200 Kč.", "Vyjednávání stále probíhá."],
      ["Tchyně nemohla přestat mluvit.", "Skutečná výmluva z průzkumu, jen jsem ji vylepšil/a: mluví pořád."],
      ["Brácha se zamkl v koupelně a jediný klíč spolkl.", "Čekáme, až příroda udělá svoje."],
      ["Děda vyhlásil rodinnou poradu o tom, kdo snědl poslední řízek.", "Byl/a jsem obviněn/a a musel/a se hájit."],
      // 🐈 Zvířata
      ["Pes mi snědl úkol a pak i náhradní úkol.", "Teď už je to princip."],
      ["Kočka mi zamkla klíče v mikrovlnce.", "A heslo k mikrovlnce zná jen ona."],
      ["Na balkoně se mi usadil holub a odmítá odejít, dokud mu neuznám nárok na byt.", "Má právníka."],
      ["Křeček utekl a já ho musel/a stopovat podle drobků.", "Vedly do sousedovy kuchyně. Tam jsem zůstal/a na oběd."],
      ["Soused mi svěřil papouška, který umí jen říkat „nikam nechoď“.", "Bylo by nezdvořilé ho neposlechnout."],
      // 📱 Technika
      ["Můj robotický vysavač vyhlásil stávku a zablokoval dveře.", "Požaduje kratší pracovní dobu a víc nabíjení."],
      ["Telefon mi spadl do kafe a teď mluví jen italsky.", "Rozumím jen „espresso“."],
      ["Lednička mi poslala zprávu, že bez ní nikam nesmím.", "Chytré domácnosti zašly moc daleko."],
      ["Wi-Fi spadla a já nevěděl/a, jak se z bytu dostat bez Google Map.", "Dveře nemají aktualizace."],
      ["Moje e-mailová schránka se přeplnila a začala vracet e-maily i do minulosti.", "Proto jste ode mě dostali zprávu, kterou jsem ještě nenapsal/a."],
      ["Toustovač vystřelil toust tak vysoko, že jsem čekal/a, až dopadne.", "Pořád nedopadl."],
      // 📚 Škola a úkoly
      ["Úkol jsem udělal/a, ale vítr ho odnesl do vedlejšího okresu.", "Tam ho prý někdo odevzdal za mě."],
      ["Napsal/a jsem ho neviditelným inkoustem kvůli ochraně autorských práv.", "Pro zobrazení je potřeba citrón a důvěra."],
      ["Učebnici mi zabavil celník, protože obsahovala podezřelé množství rovnic.", "Prý se v nich skrývá x."],
      ["Úkol jsem si uložil/a do cloudu a pak začalo pršet.", "Data jsou teď někde v kanalizaci."],
      ["Mladší sourozenec můj úkol vybarvil a teď je to umělecké dílo.", "Odevzdávat ho by byla škoda, je v galerii."],
      // 🗓️ Zapomnětlivost
      ["Myslel/a jsem, že je víkend.", "Skutečná výmluva z průzkumu. Ten pocit jsem si nechtěl/a zkazit."],
      ["Byl/a jsem přesvědčen/a, že dnes je státní svátek brambor.", "Slavím ho každý rok, vy ne?"],
      ["Vstal/a jsem včas, ale omylem jsem se znovu oblékl/a do pyžama.", "Tělo prostě ví, co chce."],
      ["Zapomněl/a jsem, kde bydlím, a bloudil/a jsem po celém sídlišti.", "Nakonec mě poznal pes od sousedů."],
      ["Zamkl/a jsem se na záchodě a jediný klíč měl kocour.", "Ten byl zrovna na procházce."],
      // 🏋️ Sport a povinnosti
      ["Do posilovny jsem nešel/nešla, protože si činky potřebovaly odpočinout.", "Regenerace je důležitá, i pro železo."],
      ["Nádobí jsem neumyl/a, protože talíře vytvořily umělecký projekt.", "Jmenuje se „Odvážná věž“ a nechci ho zničit."],
      ["Nemohl/a jsem přijít, protože jsem byl/a na tajné poradě o budoucnosti brambor.", "Víc říct nemůžu, podepsal/a jsem mlčenlivost. 🥔"],
    ];

    const nahodny = (pole) => pole[Math.floor(Math.random() * pole.length)];

    const excuseEl = document.getElementById("excuse");
    const potatoEl = document.getElementById("potato");
    const counterEl = document.getElementById("counter");
    let pocet = 0;

    document.getElementById("generate").addEventListener("click", () => {
      excuseEl.classList.add("fade");
      potatoEl.classList.toggle("spin");
      setTimeout(() => {
        // Napůl skládačka, napůl hotová výmluva s odůvodněním
        if (Math.random() < 0.5) {
          excuseEl.textContent = `${nahodny(zacatky)} ${nahodny(kdo)} ${nahodny(coSeStalo)}`;
        } else {
          const [vymluva, oduvodneni] = nahodny(hotove);
          excuseEl.textContent = `${vymluva} ${oduvodneni}`;
        }
        excuseEl.classList.remove("fade");
        pocet++;
        counterEl.textContent = `Vygenerováno výmluv: ${pocet}`;
      }, 200);
    });

    document.getElementById("copy").addEventListener("click", async (e) => {
      try {
        await navigator.clipboard.writeText(excuseEl.textContent);
        e.target.textContent = "✅ Zkopírováno!";
      } catch {
        e.target.textContent = "❌ Nepovedlo se";
      }
      setTimeout(() => (e.target.textContent = "📋 Zkopírovat"), 1500);
    });
  </script>
</body>
</html>
