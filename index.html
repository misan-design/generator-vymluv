<html lang="cs">
<head>

  <title>Generátor výmluv</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥔</text></svg>">
  <style>
    :root {
      --bg: #fff8ec;
      --card: #ffffff;
      --text: #2b2118;
      --muted: #7a6a5a;
      --accent: #e8743b;
      --accent-dark: #c95a24;
      --shadow: 0 10px 30px rgba(80, 50, 20, 0.12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1d1814;
        --card: #2a231d;
        --text: #f4ece3;
        --muted: #b5a493;
        --accent: #f08a4b;
        --accent-dark: #d46f30;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: 100%;
      max-width: 560px;
      text-align: center;
    }
    .potato {
      font-size: 72px;
      display: inline-block;
      transition: transform 0.4s ease;
    }
    .potato.spin { transform: rotate(360deg) scale(1.15); }
    h1 { margin: 8px 0 4px; font-size: clamp(28px, 6vw, 40px); }
    .sub { color: var(--muted); margin: 0 0 20px; }
    .rod {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      margin-bottom: 20px;
      border-radius: 999px;
      border: 2px solid var(--muted);
    }
    .rod button {
      padding: 8px 18px;
      background: transparent;
      color: var(--text);
      font-weight: 500;
    }
    .rod button[aria-pressed="true"] { background: var(--accent); color: #fff; }
    .card {
      background: var(--card);
      border-radius: 18px;
      padding: 28px 22px;
      box-shadow: var(--shadow);
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(18px, 4vw, 22px);
      line-height: 1.5;
      transition: opacity 0.2s ease;
    }
    .card.fade { opacity: 0; }
    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 22px;
    }
    button {
      font: inherit;
      font-weight: 600;
      border: none;
      border-radius: 999px;
      padding: 14px 26px;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
    }
    button:active { transform: scale(0.96); }
    .primary { background: var(--accent); color: #fff; }
    .primary:hover { background: var(--accent-dark); }
    .secondary { background: transparent; color: var(--text); border: 2px solid var(--muted); }
    .counter { margin-top: 18px; color: var(--muted); font-size: 14px; }
    footer { margin-top: 32px; color: var(--muted); font-size: 13px; }
  </style>
</head>

      const k = nahodny(kdo);
      const c = nahodny(coSeStalo);
      return (mluvci) => `${tvar(z, mluvci)} ${k.text} ${tvar(tvar(c, klicPuvodce(k)), mluvci)}`;
    }

    function hotova() {
      const [vymluva, oduvodneni] = nahodny(hotove);
      return (mluvci) => `${tvar(vymluva, mluvci)} ${tvar(oduvodneni, mluvci)}`;
    }

    const excuseEl = document.getElementById("excuse");
    const potatoEl = document.getElementById("potato");
    const counterEl = document.getElementById("counter");
    const rodM = document.getElementById("rod-m");
    const rodF = document.getElementById("rod-f");
    let pocet = 0;
    let mluvci = "m";
    let aktualni = null;

    function nastavMluvciho(novy) {
      mluvci = novy;
      rodM.setAttribute("aria-pressed", novy === "m");
      rodF.setAttribute("aria-pressed", novy === "f");
      if (aktualni) excuseEl.textContent = aktualni(mluvci);
    }
    rodM.addEventListener("click", () => nastavMluvciho("m"));
    rodF.addEventListener("click", () => nastavMluvciho("f"));

    document.getElementById("generate").addEventListener("click", () => {
      excuseEl.classList.add("fade");
      potatoEl.classList.toggle("spin");
      setTimeout(() => {
        // Napůl skládačka, napůl hotová výmluva s odůvodněním
        aktualni = Math.random() < 0.5 ? skladacka() : hotova();
        excuseEl.textContent = aktualni(mluvci);
        excuseEl.classList.remove("fade");
        pocet++;
        counterEl.textContent = `Vygenerováno výmluv: ${pocet}`;
      }, 200);
    });

    document.getElementById("copy").addEventListener("click", async (e) => {
      try {
        await navigator.clipboard.writeText(excuseEl.textContent);
        e.target.textContent = "✅ Zkopírováno!";
      } catch {
        e.target.textContent = "❌ Nepovedlo se";
      }
      setTimeout(() => (e.target.textContent = "📋 Zkopírovat"), 1500);
    });
  </script>
</body>
</html>
